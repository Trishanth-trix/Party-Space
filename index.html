<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="stage">
        <div class="topbar">
          <div>
            <p class="eyebrow">Shared listening</p>
            <h1>Music Room</h1>
          </div>
          <div class="room-pill">
            <span id="userCount">1</span>
            <span>online</span>
          </div>
        </div>

        <div class="room-controls">
          <label for="roomInput">Room</label>
          <div class="inline-controls">
            <input id="roomInput" type="text" autocomplete="off" value="lounge" />
            <button id="joinButton" type="button">Join</button>
          </div>
        </div>

        <div class="player-wrap">
          <div id="player"></div>
          <div id="emptyPlayer" class="empty-player">Search for a track to start the room.</div>
        </div>

        <div class="now-playing">
          <p>Now playing</p>
          <h2 id="trackTitle">Nothing loaded yet</h2>
          <span id="hostStatus">Joining room...</span>
        </div>
      </section>

      <aside class="search-panel">
        <form id="searchForm" class="search-box">
          <label for="searchInput">Search YouTube</label>
          <div class="inline-controls">
            <input id="searchInput" type="search" autocomplete="off" placeholder="Artist, song, or video" />
            <button type="submit">Search</button>
          </div>
        </form>
        <div id="results" class="results" aria-live="polite"></div>
      </aside>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
  </body>
</html>
